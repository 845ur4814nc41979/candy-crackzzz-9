kind = "web"
previewPath = "/"
title = "Candy Crackzzz"
version = "1.0.0"
id = "artifacts/candy-crackzzz"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "bash scripts/replit-start.sh"

[services.production]
build = [ "pnpm", "--filter", "@workspace/candy-crackzzz", "run", "build" ]
publicDir = "artifacts/candy-crackzzz/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
PREVIEW_PROXY_PORT = "5000"
FRONTEND_PORT = "5001"
VITE_TARGET_PORT = "5001"
API_PORT = "3001"
BASE_PATH = "/"
